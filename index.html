<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Soy Resinator</title>
  <meta name="description" content="">
  <meta name="color-scheme" content="dark light">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Saira+Condensed:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/catalogo.js"></script>
</head>
<body>
  <a class="skip" href="#main" data-i18n="nav.saltar"></a>

  <header class="site-header">
    <div class="wrap header-row">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Soy Resinator</span>
      </a>
      <div class="header-tools">
        <label class="sr-only" for="lang" data-i18n="nav.idioma"></label>
        <select id="lang" class="select select-sm"></select>
        <button id="theme" class="icon-btn" type="button">
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
          <span class="sr-only" id="theme-label"></span>
        </button>
        <a href="pedido.html" class="nav-link" data-i18n="nav.mi_pedido"></a>
      </div>
      <a href="#pedido" id="cart-link" class="cart-btn">
        <span data-i18n="nav.pedido"></span>
        <span id="cart-count" class="count" aria-hidden="true">0</span>
      </a>
    </div>
  </header>

  <main id="main">
    <section class="hero" data-view="catalogo">
      <div class="wrap">
        <p class="kicker" data-i18n="hero.kicker"></p>
        <h1 data-i18n="hero.titulo"></h1>
        <p class="lead" data-i18n="hero.texto"></p>
        <a class="btn btn-primary" href="#catalogo" data-i18n="hero.cta"></a>
      </div>
    </section>

    <section class="pillars wrap" data-view="catalogo">
      <div class="pillar">
        <h2 data-i18n="info.kit_titulo"></h2>
        <p data-i18n="info.kit_texto"></p>
      </div>
      <div class="pillar">
        <h2 data-i18n="info.color_titulo"></h2>
        <p data-i18n="info.color_texto"></p>
      </div>
      <div class="pillar">
        <h2 data-i18n="info.plazo_titulo"></h2>
        <p data-i18n="info.plazo_texto"></p>
      </div>
    </section>

    <section id="catalogo" class="wrap catalog" data-view="catalogo">
      <div class="catalog-head">
        <h2 class="section-title" data-i18n="cat.titulo"></h2>
        <div class="ship-to">
          <label for="pais" data-i18n="envio.label"></label>
          <select id="pais" class="select"></select>
        </div>
      </div>
      <p id="precio-nota" class="price-note"></p>
      <div id="otro-pais" class="notice" hidden>
        <p data-i18n="envio.otro_texto"></p>
        <p class="contact-row">
          <a class="contact-email" href="#"></a>
          <a class="contact-ig" href="#" rel="noopener" target="_blank"></a>
        </p>
      </div>

      <div id="cerrado" class="notice notice-forge" hidden>
        <h3 data-i18n="cerrado.titulo"></h3>
        <p data-i18n="cerrado.texto"></p>
        <a class="btn btn-ghost contact-ig-btn" href="#" rel="noopener" target="_blank"></a>
      </div>

      <div id="colecciones" aria-busy="true">
        <p class="muted" data-i18n="cat.cargando"></p>
      </div>
    </section>

    <!-- Pedido: se muestra con #pedido -->
    <section id="pedido" class="wrap order" hidden aria-labelledby="pedido-titulo">
      <div id="ped-main">
        <div class="order-head">
          <h2 id="pedido-titulo" class="section-title" tabindex="-1" data-i18n="ped.titulo"></h2>
          <a href="#catalogo" class="btn btn-ghost" data-i18n="ped.seguir"></a>
        </div>

        <div id="ped-cerrado" class="notice notice-forge" hidden>
          <h3 data-i18n="cerrado.titulo"></h3>
          <p data-i18n="cerrado.texto"></p>
          <a class="btn btn-ghost contact-ig-btn" href="#" rel="noopener" target="_blank"></a>
        </div>
        <div id="ped-avisos" class="notice notice-warn" role="status" hidden></div>

        <div id="items"></div>

        <form id="ped-form" novalidate hidden>
          <div id="err-resumen" class="notice notice-error" tabindex="-1" hidden>
            <p class="err-head" data-i18n="err.titulo"></p>
            <ul id="err-lista"></ul>
          </div>

          <div class="block">
            <h3 class="block-title" data-i18n="datos.titulo"></h3>
            <div class="field">
              <label for="f-nombre" data-i18n="datos.nombre"></label>
              <input id="f-nombre" name="nombre" autocomplete="name" maxlength="120" required aria-describedby="e-f-nombre">
              <p class="field-err" id="e-f-nombre"></p>
            </div>
            <div class="field">
              <label for="f-email" data-i18n="datos.email"></label>
              <input id="f-email" name="email" type="email" autocomplete="email" inputmode="email" maxlength="160" required aria-describedby="e-f-email">
              <p class="field-err" id="e-f-email"></p>
            </div>
            <div class="field">
              <label for="f-email2" data-i18n="datos.email2"></label>
              <input id="f-email2" name="email2" type="email" autocomplete="off" inputmode="email" maxlength="160" required aria-describedby="e-f-email2">
              <p class="field-err" id="e-f-email2"></p>
            </div>
            <div class="field-row">
              <div class="field field-prefix">
                <label for="f-prefijo" data-i18n="datos.prefijo"></label>
                <input id="f-prefijo" name="prefijo" autocomplete="tel-country-code" inputmode="tel" maxlength="5" required aria-describedby="e-f-prefijo">
                <p class="field-err" id="e-f-prefijo"></p>
              </div>
              <div class="field field-grow">
                <label for="f-telefono" data-i18n="datos.telefono"></label>
                <input id="f-telefono" name="telefono" type="tel" autocomplete="tel-national" inputmode="tel" maxlength="20" required aria-describedby="e-f-telefono">
                <p class="field-err" id="e-f-telefono"></p>
              </div>
            </div>
            <div class="field">
              <label for="f-pais" data-i18n="datos.pais"></label>
              <select id="f-pais" name="pais" class="select" autocomplete="country" required aria-describedby="e-f-pais"></select>
              <p class="field-err" id="e-f-pais"></p>
            </div>
            <div id="f-otro" class="notice" hidden>
              <p data-i18n="envio.otro_texto"></p>
              <p class="contact-row">
                <a class="contact-email" href="#"></a>
                <a class="contact-ig" href="#" rel="noopener" target="_blank"></a>
              </p>
            </div>
            <div class="field">
              <label for="f-direccion" data-i18n="datos.direccion"></label>
              <input id="f-direccion" name="direccion" autocomplete="street-address" maxlength="200" required aria-describedby="h-f-direccion e-f-direccion">
              <p class="help" id="h-f-direccion" data-i18n="datos.direccion_ayuda"></p>
              <p class="field-err" id="e-f-direccion"></p>
            </div>
            <div class="field-row">
              <div class="field field-cp">
                <label for="f-cp" data-i18n="datos.cp"></label>
                <input id="f-cp" name="cp" autocomplete="postal-code" maxlength="12" required aria-describedby="e-f-cp">
                <p class="field-err" id="e-f-cp"></p>
              </div>
              <div class="field field-grow">
                <label for="f-ciudad" data-i18n="datos.ciudad"></label>
                <input id="f-ciudad" name="ciudad" autocomplete="address-level2" maxlength="100" required aria-describedby="e-f-ciudad">
                <p class="field-err" id="e-f-ciudad"></p>
              </div>
            </div>
            <div class="field">
              <label for="f-instagram" data-i18n="datos.instagram"></label>
              <input id="f-instagram" name="instagram" autocomplete="off" autocapitalize="none" maxlength="60" placeholder="@">
            </div>
            <div class="hp" aria-hidden="true">
              <label for="f-web" data-i18n="datos.trampa"></label>
              <input id="f-web" name="web" tabindex="-1" autocomplete="off">
            </div>
          </div>

          <fieldset class="block">
            <legend class="block-title" data-i18n="pago.titulo"></legend>
            <label class="choice">
              <input type="radio" name="modo" value="completo" checked>
              <span><strong data-i18n="pago.completo"></strong><span class="help" data-i18n="pago.completo_ayuda"></span></span>
            </label>
            <label class="choice">
              <input type="radio" name="modo" value="dos_partes">
              <span><strong data-i18n="pago.dos_partes"></strong><span class="help" data-i18n="pago.dos_partes_ayuda"></span></span>
            </label>
            <p class="pay-info"><span data-i18n="pago.nada_ahora"></span> <span id="pago-metodo"></span></p>
            <p class="pay-info" data-i18n="pago.inicio"></p>
          </fieldset>

          <div class="block">
            <h3 class="block-title" data-i18n="res.titulo"></h3>
            <div id="resumen"></div>
            <label class="check">
              <input type="checkbox" id="f-condiciones" aria-describedby="e-f-condiciones">
              <span id="l-condiciones"></span>
            </label>
            <p class="field-err" id="e-f-condiciones"></p>
            <label class="check">
              <input type="checkbox" id="f-privacidad" aria-describedby="e-f-privacidad">
              <span id="l-privacidad"></span>
            </label>
            <p class="field-err" id="e-f-privacidad"></p>
            <button id="btn-enviar" class="btn btn-primary btn-block btn-lg" type="submit" data-i18n="res.enviar"></button>
          </div>

          <div id="fallo" class="notice notice-error" tabindex="-1" hidden>
            <h3 data-i18n="err.fallo_titulo"></h3>
            <p id="fallo-motivo"></p>
            <p data-i18n="err.fallo_texto"></p>
            <div class="btn-row">
              <button id="btn-copiar-resumen" class="btn btn-ghost" type="button" data-i18n="err.copiar"></button>
              <a class="btn btn-ghost contact-email" href="#"></a>
              <a class="btn btn-ghost contact-ig" href="#" rel="noopener" target="_blank"></a>
            </div>
          </div>
        </form>
      </div>

      <div id="confirmacion" hidden>
        <h2 id="conf-titulo" class="section-title" tabindex="-1" data-i18n="conf.titulo"></h2>
        <p class="lead" data-i18n="conf.texto"></p>
        <div class="id-box">
          <p class="id-label" data-i18n="conf.id_label"></p>
          <p id="conf-id" class="order-id"></p>
          <button id="btn-copiar-id" class="btn btn-primary" type="button" data-i18n="conf.copiar"></button>
        </div>
        <p id="conf-email" class="muted"></p>
        <div class="block">
          <h3 class="block-title" data-i18n="res.titulo"></h3>
          <div id="conf-resumen"></div>
        </div>
        <div class="block">
          <h3 class="block-title" data-i18n="conf.pasos"></h3>
          <ol class="steps">
            <li data-i18n="conf.paso1"></li>
            <li data-i18n="conf.paso2"></li>
            <li data-i18n="conf.paso3"></li>
          </ol>
        </div>
        <div class="btn-row">
          <a id="conf-seguir" class="btn btn-primary" href="pedido.html" data-i18n="conf.seguir"></a>
          <a class="btn btn-ghost" href="#catalogo" data-i18n="conf.volver"></a>
        </div>
      </div>
    </section>
  </main>

  <a id="cart-float" class="cart-float" href="#pedido" hidden>
    <span data-i18n="ped.flotante"></span>
    <span id="cart-float-count" class="count">0</span>
  </a>

  <footer class="site-footer">
    <div class="wrap footer-grid">
      <div>
        <p class="brand-name">Soy Resinator</p>
        <p class="muted" data-i18n="pie.texto"></p>
        <p class="muted small" data-i18n="pie.aviso"></p>
      </div>
      <nav class="footer-links">
        <a href="privacidad.html" data-i18n="pie.privacidad"></a>
        <a href="condiciones.html" data-i18n="pie.condiciones"></a>
        <a class="contact-email" href="#"></a>
        <a class="contact-ig" href="#" rel="noopener" target="_blank"></a>
      </nav>
    </div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
