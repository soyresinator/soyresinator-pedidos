<h2>Último correo al cliente</h2><pre id="correo"></pre>
<script>
/* ---------- SHA-256 síncrono (para Utilities.computeDigest) ---------- */
function sha256(bytes) {
  const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  let h = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const l = bytes.length, withPad = new Uint8Array(((l + 9 + 63) >> 6) << 6);
  withPad.set(bytes); withPad[l] = 0x80;
  const dv = new DataView(withPad.buffer); dv.setUint32(withPad.length - 4, l * 8);
  const w = new Uint32Array(64), r = (x, n) => (x >>> n) | (x << (32 - n));
  for (let o = 0; o < withPad.length; o += 64) {
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(o + i * 4);
    for (let i = 16; i < 64; i++) {
      const s0 = r(w[i-15],7) ^ r(w[i-15],18) ^ (w[i-15] >>> 3), s1 = r(w[i-2],17) ^ r(w[i-2],19) ^ (w[i-2] >>> 10);
      w[i] = (w[i-16] + s0 + w[i-7] + s1) >>> 0;
    }
    let [a,b,c,d,e,f,g,hh] = h;
    for (let i = 0; i < 64; i++) {
      const t1 = (hh + (r(e,6) ^ r(e,11) ^ r(e,25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) >>> 0;
      const t2 = ((r(a,2) ^ r(a,13) ^ r(a,22)) + ((a & b) ^ (a & c) ^ (b & c))) >>> 0;
      hh = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    h = h.map((v, i) => (v + [a,b,c,d,e,f,g,hh][i]) >>> 0);
  }
  const out = []; h.forEach(v => { for (let s = 24; s >= 0; s -= 8) { const x = (v >>> s) & 255; out.push(x > 127 ? x - 256 : x); } });
  return out;
}

/* ---------- Hoja simulada ---------- */
class Rango {
  constructor(sh, r, c, nr, nc) { Object.assign(this, { sh, r, c, nr, nc }); }
  getValues() {
    const out = [];
    for (let i = 0; i < this.nr; i++) {
      const row = this.sh.data[this.r - 1 + i] || [];
      out.push(Array.from({ length: this.nc }, (_, j) => row[this.c - 1 + j] ?? ''));
    }
    return out;
  }
  getValue() { return this.getValues()[0][0]; }
  setValue(v) { return this.setValues([[v]]); }
  setValues(v) {
    v.forEach((row, i) => {
      const idx = this.r - 1 + i;
      while (this.sh.data.length <= idx) this.sh.data.push([]);
      row.forEach((val, j) => { this.sh.data[idx][this.c - 1 + j] = val; });
    });
    return this;
  }
  setNumberFormats(f) {
    // Como Google: el tamaño tiene que coincidir con el rango.
    if (f.length !== this.nr || f.some(row => row.length !== this.nc)) throw new Error(`setNumberFormats: ${f.length}×${f[0] && f[0].length} en un rango ${this.nr}×${this.nc}`);
    this.sh.formats[this.r] = f[0]; return this;
  }
  setFontWeight() { return this; }
  setDataValidation() { return this; }
}
class Hoja {
  constructor(name) { this.name = name; this.data = []; this.formats = {}; }
  getName() { return this.name; }
  getLastRow() { let n = this.data.length; while (n && !this.data[n - 1].some(v => v !== '' && v !== undefined)) n--; return n; }
  getRange(r, c, nr = 1, nc = 1) { return new Rango(this, r, c, nr, nc); }
  setFrozenRows() {}
}
const ss = {
  hojas: [new Hoja('Hoja 1')],
  getSheetByName(n) { return this.hojas.find(h => h.name === n) || null; },
  insertSheet(n) { const h = new Hoja(n); this.hojas.push(h); return h; },
  getSheets() { return [...this.hojas]; },
  deleteSheet(h) { this.hojas = this.hojas.filter(x => x !== h); },
  setSpreadsheetTimeZone() {}
};
const validacion = { requireValueInList() { return this; }, setAllowInvalid() { return this; }, build() { return {}; } };
const SpreadsheetApp = { getActiveSpreadsheet: () => ss, newDataValidation: () => validacion, flush() {} };

const cacheMem = {};
const CacheService = { getScriptCache: () => ({
  get: k => cacheMem[k] ?? null, put: (k, v) => { cacheMem[k] = v; }, remove: k => { delete cacheMem[k]; },
  removeAll: ks => ks.forEach(k => delete cacheMem[k])
}) };
const LockService = { getScriptLock: () => ({ waitLock() {}, tryLock: () => true, releaseLock() {} }) };
const correos = [];
const MailApp = { sendEmail: o => correos.push(o) };
const ficheros = {};
const PAGES = 'https://soyresinator.com/';
const UrlFetchApp = { fetch: url => {
  const p = url.replace(PAGES, '');
  const txt = ficheros[p];
  return { getResponseCode: () => (txt === undefined ? 404 : 200), getContentText: () => txt };
} };
const ScriptApp = { getService: () => ({ getUrl: () => 'https://script.google.com/macros/s/TEST/exec' }) };
// Drive simulado: carpetas y ficheros en memoria, con su permiso de compartir
const drive = { carpetas: {}, ficheros: {}, n: 0 };
const nuevoFichero = blob => {
  const id = 'F' + (++drive.n);
  const f = drive.ficheros[id] = { id, blob, acceso: 'PRIVATE', getId: () => id, setSharing(a) { this.acceso = a; return this; } };
  return f;
};
const DriveApp = {
  Access: { ANYONE_WITH_LINK: 'ANYONE_WITH_LINK', PRIVATE: 'PRIVATE' }, Permission: { VIEW: 'VIEW', NONE: 'NONE' },
  createFolder: name => { const id = 'C' + (++drive.n); return drive.carpetas[id] = { name, getId: () => id, getName: () => name, getUrl: () => 'https://drive/' + id, createFile: nuevoFichero }; },
  getFolderById: id => { if (!drive.carpetas[id]) throw new Error('no existe'); return drive.carpetas[id]; },
  getFileById: id => { if (!drive.ficheros[id]) throw new Error('no existe'); return drive.ficheros[id]; }
};
const HtmlService = { createHtmlOutput: s => ({ content: s, setTitle() { return this; } }) };
const props = {};
const PropertiesService = { getScriptProperties: () => ({ getProperty: k => props[k] ?? null, setProperty: (k, v) => { props[k] = v; } }) };
const Utilities = {
  getUuid: () => crypto.randomUUID(),
  DigestAlgorithm: { SHA_256: 'SHA_256' }, Charset: { UTF_8: 'UTF_8' },
  computeDigest: (alg, s) => sha256(new TextEncoder().encode(s)),
  formatDate: (d, tz, fmt) => new Date(d).toISOString().slice(0, 10),
  newBlob: (s, mime, name) => {
    const bytes = typeof s === 'string' ? Array.from(new TextEncoder().encode(s)) : s;
    return { getBytes: () => bytes, mime, name, getName: () => name };
  },
  base64Decode: s => Array.from(atob(s), c => c.charCodeAt(0))
};
const ContentService = { MimeType: { JSON: 'json' }, createTextOutput: s => ({ content: s, setMimeType() { return this; } }) };

/* ---------- Pruebas ---------- */
const resultados = [];
function check(nombre, cond, detalle) { resultados.push({ nombre, ok: !!cond, detalle: detalle === undefined ? '' : String(detalle) }); }

(async () => {
  const rutas = ['data/catalog.json', 'data/shipping.json', 'data/config.json', 'data/colores-serie.json',
    'i18n/en.json', 'i18n/es.json', 'i18n/pt.json', 'i18n/de.json', 'i18n/fr.json', 'i18n/it.json'];
  for (const r of rutas) ficheros[r] = await (await fetch('../' + r, { cache: 'no-cache' })).text();
  // El montaje está desactivado en todos los países; para seguir probando la regla, simulamos que España lo tiene.
  const shipReal = JSON.parse(ficheros['data/shipping.json']);
  check('shipping.json real: ningún país con montaje', shipReal.paises.every(p => p.montaje === false));
  shipReal.paises.find(p => p.code === 'ES').montaje = true;
  ficheros['data/shipping.json'] = JSON.stringify(shipReal);
  const codigo = await (await fetch('../apps-script/Code.gs', { cache: 'no-cache' })).text();
  const G = new Function('SpreadsheetApp', 'CacheService', 'LockService', 'MailApp', 'UrlFetchApp', 'Utilities', 'ContentService', 'PropertiesService', 'ScriptApp', 'HtmlService', 'DriveApp',
    codigo + '\nreturn { instalar, doGet, doPost, hashEmail, AJUSTES, tokenResena, enlaceResena, limpiarCache, tokenModeracion, autorizarFotos };')(
    SpreadsheetApp, CacheService, LockService, MailApp, UrlFetchApp, Utilities, ContentService, PropertiesService, ScriptApp, HtmlService, DriveApp);

  // Las pruebas mandan muchos pedidos seguidos: el freno global se prueba al final con sus valores reales.
  const frenoReal = { hora: G.AJUSTES.MAX_PEDIDOS_HORA, dia: G.AJUSTES.MAX_PEDIDOS_DIA_TOTAL };
  G.AJUSTES.MAX_PEDIDOS_HORA = G.AJUSTES.MAX_PEDIDOS_DIA_TOTAL = 10000;
  const cat = JSON.parse(ficheros['data/catalog.json']);
  const post = body => JSON.parse(G.doPost({ postData: { contents: typeof body === 'string' ? body : JSON.stringify(body) } }).content);
  const get = p => JSON.parse(G.doGet({ parameter: p }).content);
  let n = 0;
  const pedido = (items, over = {}) => ({
    accion: 'pedido', idioma: 'es', web: '',
    cliente: { nombre: 'Ana Prueba', email: `ana${++n}@example.com`, telefono: '+34 612 345 678', direccion: 'Calle Mayor 1', cp: '08001', ciudad: 'Barcelona', instagram: '' },
    pais: 'ES', modo_pago: 'completo', items, total_cliente: 1, consentimiento: true, ...over
  });
  const item = (pid, colores = {}, montaje = false, nota = '', extras) => {
    const p = cat.productos.find(x => x.id === pid);
    const o = { pid, montaje, nota, colores: (p ? p.partes : []).map(pt => ({ grupo: pt.grupo, color_id: colores[pt.grupo] || pt.de_serie })) };
    if (extras !== undefined) o.extras = extras;
    return o;
  };
  const ped = () => ss.getSheetByName('PEDIDOS_WEB');
  const ultima = () => { const s = ped(); return s.data[s.getLastRow() - 1]; };
  const col = name => ['ID_WEB','FECHA','IDIOMA','NOMBRE','EMAIL','TELEFONO','DIRECCION','CP','CIUDAD','PAIS','INSTAGRAM','ITEMS_JSON','RESUMEN_ES','NOTAS_ORIGINAL','SUBTOTAL','MONTAJE','ENVIO','TOTAL','MODO_PAGO','SERVICIO_ENVIO','CAJAS','CONSENTIMIENTO','REGISTRADO','ID_APP'].indexOf(name);
  const colores = () => ss.getSheetByName('COLORES');
  const setStock = (id, g) => { const r = colores().data.find(x => x[0] === id); r[8] = g; };

  try {
    // Instalación
    G.instalar();
    check('instalar crea las 5 pestañas y quita la vacía', ss.hojas.map(h => h.name).sort().join(',') === 'COLORES,CONFIG,ESTADO_WEB,PEDIDOS_WEB,RESENAS', ss.hojas.map(h => h.name));
    check('COLORES con 23 filas iniciales y ELEGIBLE "sí"', colores().getLastRow() === 24 && colores().data.slice(1).every(r => r[9] === 'sí'), colores().getLastRow() - 1);
    check('Encabezados exactos de PEDIDOS_WEB (24 columnas, A..X)', ped().data[0].length === 24 && ped().data[0][23] === 'ID_APP');
    check('CONFIG fila 2 con PEDIDOS_ABIERTOS "sí"', ss.getSheetByName('CONFIG').data[1][4] === 'sí', JSON.stringify(ss.getSheetByName('CONFIG').data[1]));

    // ?accion=config
    const cfg = get({ accion: 'config' });
    check('?accion=config devuelve 23 colores elegibles y cola vacía = null', cfg.ok && cfg.colores.length === 23 && cfg.horas_cola === null && cfg.pedidos_abiertos === true, `${cfg.colores.length} colores, cola ${cfg.horas_cola}`);

    // Precio correcto aunque el navegador mande otro
    let r = post(pedido([item('founders-bolt', { rojo: 'azul-marino' }, true), item('las-pistol', {}, true)], { total_cliente: 1 }));
    let f = ultima();
    check('Founders Bolt azul marino + Las Pistol + montaje a España = 378 € (caja de 4 kg 18 €; total_cliente manipulado a 1)', r.ok && r.total === 378 && f[col('TOTAL')] === 378 && f[col('SUBTOTAL')] === 260 && f[col('MONTAJE')] === 100 && f[col('ENVIO')] === 18 && f[col('CAJAS')] === 1, JSON.stringify(r));
    check('Encabezados de ESTADO_WEB: 15 columnas, L = ID_PEDIDO, M = AVISO_ENVIO, N = ENTREGADO_EL, O = AVISO_RESENA', ss.getSheetByName('ESTADO_WEB').data[0].length === 15 && ss.getSheetByName('ESTADO_WEB').data[0][11] === 'ID_PEDIDO' && ss.getSheetByName('ESTADO_WEB').data[0][12] === 'AVISO_ENVIO' && ss.getSheetByName('ESTADO_WEB').data[0][14] === 'AVISO_RESENA');
    check('ID con formato SR-XXXXXX', /^SR-[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{6}$/.test(r.id), r.id);
    check('RESUMEN_ES correcto', f[col('RESUMEN_ES')] === '1. Founders Bolt · Detalles rojos: Azul marino · Montaje: sí | 2. Las Pistol · Cuerpo verde: Verde oscuro (de serie) · Partes negras: Negro (de serie) · Montaje: sí', f[col('RESUMEN_ES')]);
    const items = JSON.parse(f[col('ITEMS_JSON')]);
    check('ITEMS_JSON con modelo, filamento y gramos', items[0].modelo === 'bolter-pf' && items[0].colores[0].id_filamento === 'FIL-PLAM-MARINEBLUE' && items[0].colores[0].gramos === 296 && items[0].colores[0].de_serie === false, JSON.stringify(items[0].colores[0]));
    check('ITEMS_JSON con réplica y bandejas: BOLTER-PF placa 1 cambia FIL-PLAM-DARKRED por el elegido', items[0].id_replica === 'BOLTER-PF' && JSON.stringify(items[0].colores[0].placas) === '[1]' && items[0].colores[0].filamento_serie === 'FIL-PLAM-DARKRED' && items[1].id_replica === 'PISTOLA-LASER' && JSON.stringify(items[1].colores[0].placas) === '[7]' && JSON.stringify(items[1].colores[1].placas) === '[1,2,5,6]' && items[1].colores[1].filamento_serie === 'FIL-PLAM-CHARCOAL',JSON.stringify(items.map(i => [i.id_replica, i.colores.map(c => c.placas)])));
    // Cada parte del catálogo tiene bandejas y filamento de serie
    const sinPlacas = cat.productos.flatMap(p => p.partes.filter(pt => !Array.isArray(pt.placas) || !pt.placas.length || !pt.filamento_serie).map(pt => p.id + '/' + pt.grupo));
    check('catalog.json: todas las partes con placas y filamento_serie, todos los productos con id_replica', !sinPlacas.length && cat.productos.every(p => p.id_replica), sinPlacas.join(', '));
    const est = ss.getSheetByName('ESTADO_WEB').data.find(x => x[0] === r.id);
    check('ESTADO_WEB: fila inicial recibido / pendiente con hash del email', est && est[2] === 'recibido' && est[5] === 'pendiente' && est[1] === G.hashEmail(`ana${n}@example.com`), est && est.slice(0, 6).join(' | '));
    check('Dos correos: cliente (responder a la tienda) y copia "Pedido web nuevo"', correos.length === 2 && correos[0].replyTo === 'soyresinator@gmail.com' && correos[1].subject === 'Pedido web nuevo ' + r.id, correos.map(c => c.subject).join(' / '));

    // Pedido en alemán
    r = post(pedido([item('founders-bolt', { rojo: 'azul-marino' })], { idioma: 'de', pais: 'DE' }));
    f = ultima();
    const mailDe = correos[correos.length - 2];
    check('Pedido en alemán: RESUMEN_ES en español, correo al cliente en alemán', r.ok && f[col('IDIOMA')] === 'de' && f[col('RESUMEN_ES')].includes('Detalles rojos: Azul marino') && mailDe.subject.startsWith('Deine Bestellung') && mailDe.body.includes('Rote Details: Marineblau'), mailDe.subject);
    document.getElementById('correo').textContent = mailDe.subject + '\n\n' + mailDe.body;
    check('PAIS en español y servicio', f[col('PAIS')] === 'Alemania' && f[col('SERVICIO_ENVIO')] === 'Correos Standard');

    // Cajas: volumen bólter 3, rifle láser 2,5, pistola bólter 1,5, pistola láser 1; caja de 4 kg hasta 4, de 5 kg hasta 8
    const envio = (items, pais) => { post(pedido(items, { pais })); const x = ultima(); return `${x[col('CAJAS')]} cajas, ${x[col('ENVIO')]} €`; };
    let s = envio([item('founders-bolt')], 'ES');
    check('1 bólter a España = 1 caja individual = 18 €', s === '1 cajas, 18 €', s);
    s = envio([item('founders-bolt-pistol'), item('heavybolt-pistol')], 'IT');
    check('2 pistolas bólter a Italia = caja de 4 kg = 23 €', s === '1 cajas, 23 €', s);
    s = envio([item('trench-las-rifle'), item('founders-bolt-pistol')], 'IT');
    check('Rifle Krieg + pistola a Italia = caja de 4 kg = 23 €', s === '1 cajas, 23 €', s);
    s = envio([item('founders-bolt'), item('las-pistol')], 'PT');
    check('Bólter + Las Pistol a Portugal = caja de 4 kg = 20 €', s === '1 cajas, 20 €', s);
    s = envio([item('founders-bolt'), item('founders-bolt-pistol')], 'IT');
    check('Bólter + pistola bólter a Italia = caja de 5 kg = 25 €', s === '1 cajas, 25 €', s);
    s = envio([item('trench-las-rifle'), item('trooper-las-rifle')], 'DE');
    check('2 rifles a Alemania = caja de 5 kg = 17 €', s === '1 cajas, 17 €', s);
    s = envio([item('trench-las-rifle'), item('trooper-las-rifle'), item('founders-bolt-pistol'), item('las-pistol')], 'US');
    check('2 rifles + 2 pistolas a EE. UU. (Standard) = una caja de 5 kg = 50 €', s === '1 cajas, 50 €', s);
    // EE. UU.: el cliente elige Standard (45/50) o Premium (70/75)
    const envioUS = (items, envio) => { const r = post(pedido(items, { pais: 'US', ...(envio === undefined ? {} : { envio }) })); const x = ultima(); return [r, `${x[col('ENVIO')]} € ${x[col('SERVICIO_ENVIO')]}`]; };
    let [rUS, sUS] = envioUS([item('founders-bolt')]);
    check('EE. UU. sin elegir: Standard, 1 bólter = 45 €', rUS.ok && sUS === '45 € Correos Standard', sUS);
    [rUS, sUS] = envioUS([item('founders-bolt')], 'standard');
    check('EE. UU. Standard: 1 bólter = 45 €', rUS.ok && sUS === '45 € Correos Standard', sUS);
    [rUS, sUS] = envioUS([item('founders-bolt')], 'premium');
    const mailUS = correos[correos.length - 2], mailUST = correos[correos.length - 1];
    check('EE. UU. Premium: 1 bólter = 70 € y SERVICIO_ENVIO "Correos Premium"', rUS.ok && rUS.total === 230 && sUS === '70 € Correos Premium', sUS);
    check('Correos con Premium: cliente y tienda ven "Correos Premium"', mailUS.body.includes('Correos Premium') && mailUST.body.includes('Correos Premium'), mailUST.body.split('\n').find(l => l.startsWith('Envío')));
    [rUS, sUS] = envioUS([item('trench-las-rifle'), item('trooper-las-rifle'), item('founders-bolt-pistol')], 'premium');
    check('EE. UU. Premium: caja de 5 kg = 75 €', rUS.ok && sUS === '75 € Correos Premium', sUS);
    r = post(pedido([item('founders-bolt')], { pais: 'DE', envio: 'premium' }));
    check('Premium en un país sin esa opción (Alemania): rechazado', r.error === 'datos_invalidos', JSON.stringify(r));
    r = post(pedido([item('founders-bolt')], { pais: 'US', envio: 'urgentisimo' }));
    check('Tipo de envío desconocido: rechazado', r.error === 'datos_invalidos', JSON.stringify(r));
    s = envio([item('founders-bolt'), item('heavy-bolt'), item('renegade-bolt')], 'DE');
    check('3 bólters a Alemania = caja de 5 kg + individual = 33 €', s === '2 cajas, 33 €', s);
    s = envio([item('las-pistol'), item('las-pistol'), item('founders-bolt-pistol')], 'GB');
    check('3 pistolas a Reino Unido = caja de 4 kg = 22 €', s === '1 cajas, 22 €', s);
    r = post(pedido([item('founders-bolt')], { pais: 'SE' }));
    f = ultima();
